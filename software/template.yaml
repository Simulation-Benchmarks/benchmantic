#
# A software description: how a simulation software organises a benchmark
# implementation, so benchmantic can read it and run it. You rarely write one
# yourself: a run config only names the software (`software: MyCode`), and
# benchmantic uses software_descriptions/<name>.yaml or lets the LLM write
# the description. This file lists every key, for reading or fixing one.

name: MyCode                         # the software's name, written to the description
input_label: the MyCode input file   # how the inputs are called in messages
display: "{section}:{key}"           # how one input is written for people

# The folder holding the benchmark implementation. Either list files that
# sit side by side in it (found anywhere below module_dir) ...
implementation:
  files: [main.py]
  # folder: path/to/it               # relative to module_dir, if several match
# ... or leave `implementation` out: the benchmark is then the folder
# holding the cases (as for OpenFOAM).

cases:
  marker: parameters.ini             # a folder with this file is one case
  nested: true                       # cases may sit inside another case
  ids: path                          # path: cases/fine -> cases_fine | folder_name: fine
  zips: false                        # also look for cases inside *.zip

# Files read for license (SPDX headers), name and description, relative to
# the implementation folder; or {input_files_named: [...]} to use some of
# the input files instead.
sources: [main.py]

inputs:
  format: ini                        # a reader in software/formats/: ini | foam_dict | python
                                     # python: top-level constants in a script or notebook
                                     #   (r = 0.05, dt = 1 / 1600, Constant(mesh, 0.001))
  files: [parameters.ini]            # ini, python: the input file(s) of a case; python:
                                     #   default the file the implementation link points at
  # folders: [system, constant, "0"] # foam_dict: case sub-folders with inputs
  # search:                          # find the parameter file if it isn't named
  #   patterns: ["*.input", "*.ini"] # like `files`: candidates are read with the
  #   max_depth: 3                   # format, ranked by being named in the code
  default_selection:                 # pre-selected as case-varying (step 2)
    sections: ["*"]                  # section names or patterns
    # placeholders_first: true       # prefer inputs written as "{name}"
    # numeric_only: true
    label: all parameters
  # code_hints:                      # optional: where the code reads an input
  #   files: [main.py]
  #   pattern: 'params\["(?P<key>[^"]+)"\]'   # a `key` group is required;
  #   key_format: "{section}.{key}"           # `var`/`type` groups are optional
  #   hint: "read into `{var}`"
  #   hint_without_var: "read here"

metrics:
  from: json_keys                    # json_keys: the keys the code writes to solution_metrics.json
                                     # variables: values of the code's variables when it ends
                                     #   (python format); the workflow writes them to the file
  # values:                          # variables: {metric name: Python expression}; default:
  #   drag_coefficient_max: "max(C_D)"   # printed values, and arrays filled in a loop
  files: ["*.py"]                    # file name patterns ...
  subfolders: true                   # ... also in sub-folders
  parent_folder: false               # ... also in the folder above
  must_mention: solution_metrics.json  # only files that write the metrics file

label: markdown_title                # markdown_title (README "# Title") | cpp_class | main_file
description: markdown_section        # markdown_section (README section) | doxygen | main_file
                                     # main_file: the linked script's docstring/comments or the
                                     #   notebook's markdown cells (else the README, as above)
executable:
  from: none                         # cmake | entry (a value in an input file) | none
  # file: system/controlDict         # entry: the file in the case ...
  # key: application                 # ... and the entry holding the executable
  # test_macros: [dumux_add_test]    # cmake: macros declaring a target, and
  # source: main.cc                  # the source that marks the right one

run:                                 # how one case is run, in the container
  type: program                      # program: one program, every input on its command line
                                     # case_folder: inputs written into the case's files, then it is run
                                     # script: a Python script or notebook, inputs written into a copy
                                     #   of its code (python format), then the copy is run
  # script: main.py                  # script: the file to run (default: the linked file)
                                     #   command: "python3 {script}" -- {script} is the prepared copy
  results_folder: /shared            # folder in the container where results are saved
  working_folder: "{container_root}/{repository}/{implementation_path}"
                                     # where the program runs; {container_root} is the folder above
                                     # results_folder, {repository} the repository's name
  command: "python3 main.py"         # program: the command; {executable} is the program found above
  input_argument: '--{input} "{value}"'   # program: how one input is passed
  # output_name_input: Output.Name   # program: the input that names the run's output
  # results_zip_name_input: Output.Name  # program: name the results zip after this input
  # run_script: Allrun               # case_folder: run this script if the case has one,
  # command: "./Allrun"              #   with this command ...
  # command_without_script: "{solver}"   # ... else this
  # default_solver: mySolver
  # set_value_command: 'setValue {section} {key} {value}'   # case_folder: set one input
  # setup: "source /opt/env.sh"      # case_folder: shell lines run first
  # metrics_arguments: "--single-case ."   # case_folder: arguments for the metrics script, if
  # metrics_arguments_fallback: "."         #   it mentions their first word; else these

notes: |
  TODO: tell the LLM what a parameter's "ini": [section, key] pair is for
  this code (e.g. the input file section and the entry name), what
  "cpp_hint" and "code_context" contain, and naming conventions that imply
  units (e.g. `nu` is a kinematic viscosity in m2/s).
