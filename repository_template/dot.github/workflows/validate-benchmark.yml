name: Validate benchmark description

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install semantic-benchmark
        run: python -m pip install -r requirements.txt pyshacl

      - name: Check the benchmark description against the semantic-benchmark shapes
        run: python scripts/validate_benchmark.py @@BENCHMARK_FILE@@
