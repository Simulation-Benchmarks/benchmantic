# Describe a benchmark with benchmantic, create its benchmark repository in a
# GitHub account, and wait for that repository's own GitHub Actions.
# Start it from the Actions tab: "Create benchmark repository" -> "Run workflow".
# "Discover DuMux benchmarks" (discover-benchmarks.yml) runs it for each new entry of the DuMux list.
#
# Repository secrets (Settings -> Secrets and variables -> Actions):
#   BENCHMARK_REPO_TOKEN  personal access token of the target account (classic: scopes
#                         repo + workflow); GITHUB_TOKEN cannot create repositories
#   LLM_API_KEY           API key of the LLM (the repository variable LLM_PROVIDER, default
#                         groq); needed when the LLM is asked
#   ROHUB_DEV_USERNAME,   login on the development RoHub (https://rohub2020-devel.apps.bst2.paas.psnc.pl);
#   ROHUB_DEV_PASSWORD    with "rohub" ticked, copied into the new repository, which uploads its runs there
#   ROHUB_PROD_USERNAME,  optional: login on rohub.org, for a benchmark with rohub_production: true
#   ROHUB_PROD_PASSWORD
name: Create benchmark repository

on:
  workflow_dispatch:
    inputs:
      config:
        description: Run config of the benchmark
        default: examples/taylor-couette-flow/benchmantic.yaml
      owner:
        description: GitHub account for the new repository (empty = the owner of this repository)
        default: ""
      ask_llm:
        description: Ask the LLM again for every parameter and metric (else only for those without stored answers)
        type: boolean
        default: false
      rohub:
        description: Set up RoHub (research object, logins) and run the new repository's RoHub Integration CI
        type: boolean
        default: true
  workflow_call:   # by "Discover DuMux benchmarks", once per benchmark
    inputs:
      config:
        type: string
        required: true
      owner:
        type: string
        default: ""
      ask_llm:
        type: boolean
        default: false
      rohub:
        type: boolean
        default: true

jobs:
  create:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      CONFIG: ${{ inputs.config }}
      OWNER: ${{ inputs.owner || github.repository_owner }}
      ASK_LLM: ${{ inputs.ask_llm }}
      LLM_PROVIDER: ${{ vars.LLM_PROVIDER || 'groq' }}
      LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
      GH_TOKEN: ${{ secrets.BENCHMARK_REPO_TOKEN }}
      ROHUB: ${{ inputs.rohub }}
      ROHUB_DEV_USERNAME: ${{ secrets.ROHUB_DEV_USERNAME }}
      ROHUB_DEV_PASSWORD: ${{ secrets.ROHUB_DEV_PASSWORD }}
      ROHUB_PROD_USERNAME: ${{ secrets.ROHUB_PROD_USERNAME }}
      ROHUB_PROD_PASSWORD: ${{ secrets.ROHUB_PROD_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false  # push with BENCHMARK_REPO_TOKEN, not this run's token
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt reuse

      - name: Set up git and GitHub
        env:
          ACTOR: ${{ github.actor }}
          ACTOR_ID: ${{ github.actor_id }}
        run: |
          if [ -z "$GH_TOKEN" ]; then echo "::error::Add the repository secret BENCHMARK_REPO_TOKEN."; exit 1; fi
          if [ "$ROHUB" = "true" ] && { [ -z "$ROHUB_DEV_USERNAME" ] || [ -z "$ROHUB_DEV_PASSWORD" ]; }; then
            echo "::error::Add the repository secrets ROHUB_DEV_USERNAME and ROHUB_DEV_PASSWORD (your development RoHub login), or untick rohub."; exit 1
          fi
          gh auth setup-git
          # one artifact per benchmark (a discovery run creates several)
          echo "ARTIFACT=benchmark-repository-$(basename "$(dirname "$CONFIG")")" >> "$GITHUB_ENV"
          git config --global user.name "$ACTOR"
          git config --global user.email "${ACTOR_ID}+${ACTOR}@users.noreply.github.com"

      - name: Describe the benchmark and verify the description
        run: |
          args=(--config "$CONFIG" --provider "$LLM_PROVIDER")
          if [ "$ASK_LLM" = "true" ]; then args+=(--clear-cache); fi
          python workflow.py "${args[@]}"
          { echo "### What benchmantic found"; cat outputs/*/review.md; } >> "$GITHUB_STEP_SUMMARY"

      - name: Create the repository and wait for its GitHub Actions
        run: |
          args=(--config "$CONFIG" --org "$OWNER" --github --watch)
          if [ "$ROHUB" = "true" ]; then args+=(--rohub); fi
          python create_benchmark_repo.py "${args[@]}"

      - name: Upload the description and the repository
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT || 'benchmark-repository' }}
          path: |
            outputs/
            !outputs/repositories/*/.git/
          include-hidden-files: true
          if-no-files-found: ignore
