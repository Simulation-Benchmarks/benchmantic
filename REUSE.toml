version = 1

[[annotations]]
path = "**.pyc"
SPDX-FileCopyrightText = "2026 Simulation-Benchmarks"
SPDX-License-Identifier = "MIT"

[[annotations]]
path = ["README.md", "SKILL.md"]
SPDX-FileCopyrightText = "2026 Simulation-Benchmarks"
SPDX-License-Identifier = "MIT"

# Minimal example implementations the adapter tests run against. Their
# source files carry SPDX headers like a real benchmark's do (the pipeline
# scrapes them), so this annotation overrides those.
[[annotations]]
path = "tests/fixtures/**"
precedence = "override"
SPDX-FileCopyrightText = "2026 Simulation-Benchmarks"
SPDX-License-Identifier = "MIT"

# The bundled examples (examples/). Their DuMux sources carry their own
# GPL-3.0-or-later headers, which take precedence ("closest"); the rest --
# run configs, write-ups, reviewed metadata -- is covered here.
[[annotations]]
path = "examples/**"
precedence = "closest"
SPDX-FileCopyrightText = "2026 Simulation-Benchmarks"
SPDX-License-Identifier = "MIT"

# The files of a generated benchmark repository (create_benchmark_repo.py), without
# headers of their own: the generated repository's REUSE.toml licenses them there.
[[annotations]]
path = "repository_template/**"
SPDX-FileCopyrightText = "2026 Simulation-Benchmarks"
SPDX-License-Identifier = "MIT"
